<!DOCTYPE html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/images/icons/favicon.ico" />
    <meta http-equiv="X-UA-Compatible" content="IE=Edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
    <meta name="theme-color" content="#2a121c" />
    <meta name="description" content="Betman games" />

    <link rel="icon" href="%PUBLIC_URL%/images/icons/logo.svg" type="image/svg+xml">
    <link rel="icon" href="%PUBLIC_URL%/images/icons/logo192.png" sizes="192x192" type="image/png">
    <link rel="apple-touch-icon" sizes="180x180" href="%PUBLIC_URL%/images/icons/logo180.png">

    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="WinUp" />

    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;500;700&family=Roboto+Condensed:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

    <title>Betman games</title>

    <style>
      [data-theme='dark'] {
        --brand: #034659;
        --brand-hover: #034C5D;
        --brand-disabled: rgba(21, 120, 106, 0.3);
        --text-for-brand: #fff;
        --text-for-brand-disabled: rgba(255, 255, 255, 0.24);
        --primary: rgba(3, 76, 93, 0.6);
        --primary-hover: rgba(3, 113, 131, 0.45);
        --primary-disabled: rgba(3, 76, 93, 0.35);
        --text-for-primary: #fff;
        --text-for-primary-disabled: rgba(255, 255, 255, 0.4);
        --link: #0490A8;
        --link-hover: #036F82;
        --link-disabled: rgba(4, 144, 168, 0.4);
        --material: #001416;
        --material-hover: #033c43;
        --material-disabled: rgba(3, 70, 89, 0.9);
        --text-for-material: #fff;
        --text-for-material-disabled: rgba(255, 255, 255, 0.4);
        --tertiary: #fff;
        --tertiary-hover: rgba(255, 255, 255, 0.32);
        --tertiary-disabled: rgba(255, 255, 255, 0.1);
        --sub-text: rgba(255, 255, 255, 0.68);
        --bg: #031b1f;
        --border: rgba(255, 255, 255, 0.1);
      }

      [data-theme='light'] {
        --brand: #034659;
        --brand-hover: #034C5D;
        --brand-disabled: rgba(21, 120, 106, 0.3);
        --text-for-brand: #ffffff;
        --text-for-brand-disabled: rgba(255, 255, 255, 0.4);
        --primary: rgba(50, 50, 50, 0.2);
        --primary-hover: rgba(50, 50, 50, 0.3);
        --primary-disabled: rgba(50, 50, 50, 0.4);
        --text-for-primary: #ffffff;
        --text-for-primary-disabled: rgba(255, 255, 255, 0.4);
        --link: #0490A8;
        --link-hover: #036F82;
        --link-disabled: rgba(4, 144, 168, 0.4);
        --material: #ffffff;
        --material-hover: #f7f5f7;
        --material-disabled: #f2f0f2;
        --text-for-material: #1a1a1a;
        --text-for-material-disabled: rgba(0, 0, 0, 0.4);
        --tertiary: #f7f7f7;
        --tertiary-hover: rgba(0, 0, 0, 0.06);
        --tertiary-disabled: rgba(0, 0, 0, 0.04);
        --sub-text: rgba(0, 0, 0, 0.6);
        --bg: #eff1f2;
        --border: rgba(1, 1, 1, 0.1);
      }

      :root {
        --yellow: #ffe100;
        --amber: #f38a28;
        --amber-hover: #78421c;
        --red: #f00;
        --red-hover: #930102;
        --green: #007447;
        --green-hover: #034f50;
        --blue: #0867a4;
        --blue-hover: #00498d;
        --white: #fff;
        --black: #000;
      }

      *,
      *::after,
      *::before {
        box-sizing: border-box;
      }

      html {
        background-color: var(--material);
      }

      body {
        margin: 0;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        background-image: linear-gradient(180deg, var(--material) 0%, var(--bg) 30%);
        min-width: 23.43rem;
        min-height: 100dvh;
        overflow-y: auto;
        line-height: var(--line-height);
        color: var(--text-for-material);
        font-family: var(--font-family);
        font-size: var(--font-size);
        font-weight: var(--typography-thin);
      }

      noscript {
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--text-for-primary);
        height: 100vh;
        width: 100vw;
        margin: 0;
        padding: 0;
      }
    </style>

    <script>
      (() => {
        try {
          document.documentElement.setAttribute('data-theme', localStorage.getItem('theme') || 'dark')
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'dark')
        }
      })()
    </script>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
