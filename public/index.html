<!DOCTYPE html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/icons/favicon.ico" />
    <meta http-equiv="X-UA-Compatible" content="IE=Edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="theme-color" content="#2a121c" />
    <meta name="description" content="Admin" />

    <link rel="icon" type="image/png" sizes="32x32" href="%PUBLIC_URL%/icons/logo32.png">
    <link rel="icon" type="image/png" sizes="64x64" href="%PUBLIC_URL%/icons/logo64.png">
    <link rel="icon" type="image/png" sizes="96x96" href="%PUBLIC_URL%/icons/logo96.png">
    <link rel="icon" type="image/png" sizes="192x192" href="%PUBLIC_URL%/icons/logo192.png">

    <link rel="apple-touch-icon" sizes="120x120" href="%PUBLIC_URL%/icons/logo120.png">
    <link rel="apple-touch-icon" sizes="152x152" href="%PUBLIC_URL%/icons/logo152.png">
    <link rel="apple-touch-icon" sizes="167x167" href="%PUBLIC_URL%/icons/logo167.png">
    <link rel="apple-touch-icon" sizes="180x180" href="%PUBLIC_URL%/icons/logo180.png">
    <link rel="apple-touch-icon" sizes="192x192" href="%PUBLIC_URL%/icons/logo192.png">

    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="WinUp" />

    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;500;700&family=Roboto+Condensed:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <title>WinUp Games</title>

    <style>
      [data-theme='dark'] {
        --brand: #97195a;
        --brand-hover: #be1270;
        --brand-disabled: rgba(180, 21, 106, 0.24);
        --text-for-brand: #fff;
        --text-for-brand-disabled: rgba(255, 255, 255, 0.24);

        --primary: rgba(78, 58, 67, 0.64);
        --primary-hover: rgba(78, 58, 67, 0.88);
        --primary-disabled: rgba(78, 58, 67, 0.4);
        --text-for-primary: #fff;
        --text-for-primary-disabled: rgba(255, 255, 255, 0.4);

        --link: #f070a6;
        --link-hover: #ea5398;
        --link-disabled: #fbb2cd;

        --material: #2a121c;
        --material-hover: #3e2831;
        --material-disabled: #3e2831;
        --text-for-material: #fff;
        --text-for-material-disabled: rgba(255, 255, 255, 0.4);

        --tertiary: #fff;
        --tertiary-hover: rgba(255, 255, 255, 0.32);
        --tertiary-disabled: rgba(255, 255, 255, 0.1);

        --sub-text: rgba(255, 255, 255, 0.68);

        --bg: #0d0509;
        --border: rgba(78, 58, 67, 0.64);
      }

      [data-theme='light'] {
        --brand: #b81764;
        --brand-hover: #9d1154;
        --brand-disabled: rgba(184, 23, 100, 0.24);
        --text-for-brand: #ffffff;
        --text-for-brand-disabled: rgba(255, 255, 255, 0.4);

        --primary: rgba(50, 50, 50, 0.2);
        --primary-hover: rgba(50, 50, 50, 0.3);
        --primary-disabled: rgba(50, 50, 50, 0.4);
        --text-for-primary: #ffffff;
        --text-for-primary-disabled: rgba(255, 255, 255, 0.4);

        --link: #c22f6a;
        --link-hover: #a7245b;
        --link-disabled: #e8a1c1;

        --material: #ffffff;
        --material-hover: #f7f5f7;
        --material-disabled: #f2f0f2;
        --text-for-material: #1a1a1a;
        --text-for-material-disabled: rgba(0, 0, 0, 0.4);

        --tertiary: #f7f7f7;
        --tertiary-hover: rgba(0, 0, 0, 0.06);
        --tertiary-disabled: rgba(0, 0, 0, 0.04);

        --sub-text: rgba(0, 0, 0, 0.6);

        --bg: #eff1f2;
        --border: rgba(39, 47, 53, 0.12);
      }

      :root {
        --amber: #f38a28;
        --amber-hover: #78421c;
        --red: #f00;
        --red-hover: #930102;
        --green: #007447;
        --green-hover: #034f50;
        --blue: #0867a4;
        --blue-hover: #00498d;
        --white: #fff;
        --black: #000;
      }

      *,
      ::after,
      ::before {
        box-sizing: border-box;
      }

      html {
        background-color: var(--material);
      }

      body {
        margin: 0;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        background-image: linear-gradient(180deg, var(--material) 0%, var(--bg) 30%);
        min-width: 83.375rem;
        min-height: 100dvh;
        overflow-y: auto;
        line-height: var(--line-height);
        color: var(--text-for-material);
        font-family: var(--font-family);
        font-size: var(--font-size);
        font-weight: var(--typography-thin);
      }

      noscript {
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--text-for-primary);
        height: 100vh;
        width: 100vw;
        margin: 0;
        padding: 0;
      }
    </style>

    <script>
      (() => {
        try {
          document.documentElement.setAttribute('data-theme', localStorage.getItem('theme') || 'dark')
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'dark')
        }
      })()
    </script>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
